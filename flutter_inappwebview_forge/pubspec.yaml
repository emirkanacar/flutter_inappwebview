name: flutter_inappwebview_forge
description: A Flutter plugin that allows you to add an inline webview, to use an headless webview, and to open an in-app browser window.
version: 2.1.61
repository: https://github.com/emirkanacar/flutter_inappwebview
issue_tracker: https://github.com/emirkanacar/flutter_inappwebview/issues
topics:
  - html
  - webview
  - webview-flutter
  - inappwebview
  - browser

environment:
  sdk: ^3.8.0
  flutter: ">=3.38.6"

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview_forge_platform_interface: ^1.1.9
    # path: ../flutter_inappwebview_forge_platform_interface
  flutter_inappwebview_forge_android: ^1.0.50
    # path: ../flutter_inappwebview_forge_android
  flutter_inappwebview_forge_ios: ^2.1.27
    # path: ../flutter_inappwebview_forge_ios
  flutter_inappwebview_forge_macos: ^1.1.6
    # path: ../flutter_inappwebview_forge_macos
  flutter_inappwebview_forge_web: ^1.0.2
    # path: ../flutter_inappwebview_forge_web
  flutter_inappwebview_forge_windows: ^1.0.10
    # path: ../flutter_inappwebview_forge_windows
  flutter_inappwebview_forge_linux: ^1.0.4
    # path: ../flutter_inappwebview_forge_linux

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  generators:
    path: ../dev_packages/generators

# For information on the generic Dart part of this file, see the
# following page: https://www.dartlang.org/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  plugin:
    platforms:
      android:
        default_package: flutter_inappwebview_forge_android
      ios:
        default_package: flutter_inappwebview_forge_ios
      macos:
        default_package: flutter_inappwebview_forge_macos
      web:
        default_package: flutter_inappwebview_forge_web
      windows:
        default_package: flutter_inappwebview_forge_windows
      linux:
        default_package: flutter_inappwebview_forge_linux

  assets:
    - packages/flutter_inappwebview_forge/assets/t_rex_runner/t-rex.html
    - packages/flutter_inappwebview_forge/assets/t_rex_runner/t-rex.css
  # To add assets to your plugin package, add an assets section, like this:
  # assets:
  #  - images/a_dot_burr.jpeg
  #  - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.io/assets-and-images/#from-packages
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.io/assets-and-images/#resolution-aware.

  # To add custom fonts to your plugin package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.io/custom-fonts/#from-packages

false_secrets:
  - /test_node_server/*.pem
  - /test_node_server/*.pfx
